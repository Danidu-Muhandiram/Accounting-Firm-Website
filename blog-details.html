<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blog Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar_service navbar-expand-lg bg-body-tertiary custom-navbar fixed-top pt-3">
    <div class="container">
      <a class="navbar-brand" href="index.html">Palo Accounting<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#About">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="services.html">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#Feedbacks">Feedbacks</a>
          </li>
          <li class="nav-item blog-icon">
            <a class="nav-link active" aria-current="page" href="blog.html">Blog</a>
          </li>
        </ul>

        <a href="#" class="btn-primary-custom navbar-button fs-7 ms-lg-3 open-contact">Contact Us</a>
      </div>
    </div>
  </nav>

  <main class="blog-detail">
    <section class="blog-detail-hero">
      <div class="container">
        <a href="blog.html" class="blog-detail-back">Back to Blog</a>
        <div class="blog-detail-meta">
          <span id="blog-category" class="blog-detail-pill">Case Study</span>
          <span id="blog-date" class="blog-detail-date"></span>
          <span id="blog-readtime" class="blog-detail-readtime"></span>
        </div>
        <h1 id="blog-title" class="blog-detail-title"></h1>
        <p id="blog-subtitle" class="blog-detail-subtitle"></p>
      </div>
    </section>

    <section class="blog-detail-body">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-8">
            <img id="blog-image" class="blog-detail-image" alt="Blog image" src="images/blog1.jpg">
            <div id="blog-content" class="blog-detail-content"></div>
          </div>
          <div class="col-lg-4">
            <div class="blog-detail-card">
              <h3>Key takeaways</h3>
              <ul id="blog-highlights"></ul>
            </div>
            <div class="blog-detail-card">
              <h3>How we help</h3>
              <p id="blog-cta" class="mb-3"></p>
              <a href="#" class="btn-primary-custom open-contact">Start a conversation</a>
            </div>
            <div class="blog-detail-card">
              <h3>More stories</h3>
              <p class="mb-2">Explore additional client successes and planning insights.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <script src="blog-details.js"></script>
</body>
</html>
